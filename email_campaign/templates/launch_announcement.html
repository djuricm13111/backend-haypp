<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>We're open!</title>
</head>
<body style="margin:0;padding:0;background:#f5f5f5;font-family:Arial,sans-serif;">

  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f5;padding:40px 0;">
    <tr>
      <td align="center">
        <table width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background:#ffffff;border-radius:8px;overflow:hidden;">

          <!-- Header -->
          <tr>
            <td align="center" style="background-color:#001a57; padding:28px 32px;">
              <img
                src="https://snus-s3.s3.eu-north-1.amazonaws.com/email_images/snuswe-icon.png"
                alt="SnusWe"
                style="height:56px; width:auto; display:inline-block;"
              />
            </td>
          </tr>

          <!-- Hero band -->
          <tr>
            <td style="background:#1a1a2e;padding:40px 32px;text-align:center;">
              <p style="margin:0 0 10px;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:#a0c4db;">Great news</p>
              <h1 style="margin:0 0 14px;font-size:32px;font-weight:700;color:#ffffff;line-height:1.2;">
                Orders are now open!
              </h1>
              <p style="margin:0;font-size:16px;color:#cbd5e0;line-height:1.6;">
                You signed up to be first in line — and here you are.<br>
                Delivery to your region is ready. Time to stock up.
              </p>
            </td>
          </tr>

          <!-- CTA -->
          <tr>
            <td align="center" style="padding:36px 32px;">
              <a
                href="{{ shop_url }}"
                style="display:inline-block;background:#1a1a2e;color:#ffffff;text-decoration:none;font-size:15px;font-weight:600;padding:15px 40px;border-radius:6px;letter-spacing:0.5px;"
              >
                Shop now
              </a>
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td style="padding:0 32px;">
              <hr style="border:none;border-top:1px solid #e8e8e8;margin:0;" />
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:24px 32px;text-align:center;">
              <p style="margin:0 0 6px;font-size:12px;color:#999;">
                You received this email because you signed up for early access at snuswe.com.
              </p>
              <p style="margin:0;font-size:12px;color:#bbb;">
                &copy; 2025 SnusWe &mdash; Love Braculjevica 14, Novi Sad 21000
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
