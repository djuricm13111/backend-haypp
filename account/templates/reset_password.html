<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      .email-body {
        font-family: Arial, Helvetica, sans-serif;
        color: #333333;
        margin: 0;
        padding: 0;
        background-color: #f5f5f5;
      }
      .email-container {
        max-width: 600px;
        margin: 20px auto;
        padding: 0;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        overflow: hidden;
        background-color: #ffffff;
      }
      .email-header {
        background-color: #0f766e;
        color: #ffffff;
        padding: 20px 16px;
        text-align: center;
      }
      .email-header h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .email-content {
        padding: 28px 24px 32px;
        font-size: 15px;
        line-height: 1.55;
      }
      .email-content p {
        margin: 0 0 16px;
      }
      .button-wrap {
        margin: 28px 0 24px;
        text-align: center;
      }
      .email-footer {
        font-size: 12px;
        color: #666666;
        padding: 16px 24px 20px;
        border-top: 1px solid #eeeeee;
        line-height: 1.5;
      }
      .email-footer p {
        margin: 0 0 8px;
      }
    </style>
  </head>
  <body>
    <div class="email-body">
      <div class="email-container">
        <div class="email-header">
          <h1>{{ email_texts.title }}</h1>
        </div>

        <div class="email-content">
          <p>{{ greeting }}</p>
          <p>{{ email_texts.body }}</p>
          <div class="button-wrap">
            <a
              href="{{ reset_link }}"
              style="
                display: inline-block;
                padding: 14px 28px;
                margin: 0;
                background-color: #0f766e;
                color: #ffffff !important;
                text-decoration: none;
                border-radius: 6px;
                font-size: 15px;
                font-weight: 600;
                font-family: Arial, Helvetica, sans-serif;
                line-height: 1.2;
                border: none;
              "
              >{{ email_texts.button_label }}</a
            >
          </div>
          <p>{{ email_texts.footer_body }}</p>
          <p style="font-size: 13px; color: #555555; word-break: break-all">
            {{ email_texts.link_fallback_label }}<br />
            <a href="{{ reset_link }}" style="color: #0f766e">{{ reset_link }}</a>
          </p>
        </div>
        <div class="email-footer">
          <p>{{ email_texts.thanks }}<br />{{ email_texts.team }}</p>
          <p>{{ email_texts.contact_info }}</p>
        </div>
      </div>
    </div>
  </body>
</html>
